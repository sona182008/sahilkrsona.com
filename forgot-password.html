<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Renu Store Pro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f5f7fa, #e8f5e9);
            padding: 20px;
        }

        .forgot-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #16a34a;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #15803d;
        }

        button:disabled {
            background: #86efac;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 14px;
            line-height: 1.5;
            text-align: center;
        }

        .success {
            display: block !important;
            color: #166534;
            background: #dcfce7;
            border: 1px solid #86efac;
        }

        .error {
            display: block !important;
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #16a34a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .note {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="forgot-container">

        <div class="logo">Renu Store Pro</div>

        <h2>Forgot Password?</h2>

        <p class="subtitle">
            Apna registered email address enter karein.
            Hum aapko password reset karne ka link bhej denge.
        </p>

        <form id="forgotPasswordForm">

            <div class="input-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <button type="submit" id="resetBtn">
                Send Reset Link
            </button>

        </form>

        <div id="message"></div>

        <a href="login.html" class="back-login">
            ← Back to Login
        </a>

        <p class="note">
            Password reset email na mile to Spam/Junk folder bhi check karein.
        </p>

    </div>


    <!-- Firebase -->
    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            sendPasswordResetEmail
        }
        from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        // ==========================================
        // FIREBASE CONFIG
        // ==========================================
        // Yahan apna Firebase project ka config paste karo.

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.firebasestorage.app",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };


        // Firebase initialize
        const app = initializeApp(firebaseConfig);

        // Firebase Authentication
        const auth = getAuth(app);


        // ==========================================
        // FORM
        // ==========================================

        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const resetBtn = document.getElementById("resetBtn");
        const message = document.getElementById("message");


        // ==========================================
        // SHOW MESSAGE
        // ==========================================

        function showMessage(text, type) {

            message.textContent = text;

            message.className = "";

            message.classList.add(type);
        }


        // ==========================================
        // RESET PASSWORD
        // ==========================================

        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            const email = emailInput.value.trim();


            if (!email) {

                showMessage(
                    "Please enter your email address.",
                    "error"
                );

                return;
            }


            resetBtn.disabled = true;
            resetBtn.textContent = "Sending...";

            message.className = "";
            message.textContent = "";


            try {

                await sendPasswordResetEmail(auth, email);


                showMessage(
                    "Password reset link successfully sent! Apna email inbox aur Spam/Junk folder check karein.",
                    "success"
                );


                form.reset();


            } catch (error) {

                console.error("Password Reset Error:", error);


                let errorMessage =
                    "Password reset email send nahi ho saka. Please try again.";


                switch (error.code) {

                    case "auth/invalid-email":

                        errorMessage =
                            "Please enter a valid email address.";

                        break;


                    case "auth/user-not-found":

                        errorMessage =
                            "Is email se koi account nahi mila.";

                        break;


                    case "auth/too-many-requests":

                        errorMessage =
                            "Too many attempts. Thodi der baad dobara try karein.";

                        break;


                    case "auth/network-request-failed":

                        errorMessage =
                            "Internet connection check karein.";

                        break;

                }


                showMessage(errorMessage, "error");


            } finally {

                resetBtn.disabled = false;
                resetBtn.textContent = "Send Reset Link";

            }

        });

    </script>

</body>
</html>
